name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changes:
    if: github.repository == 'ryanTheLion200/react-highlight-shiki'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      joined-filters: ${{ steps.format.outputs.joined-filters }}
      empty: ${{ steps.format.outputs.empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter Packages
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shiki-bundle-codegen:
              - 'packages/shiki-bundle-codegen/**'
            react-highlight-shiki:
              - 'packages/react-highlight-shiki/**'
      - name: Filter Format
        id: format
        shell: bash
        run: |
          JOINED_FILTERS=$(jq -c -r 'map("--filter " + .) | join(" ")' <<< '${{ steps.filter.outputs.changes }}')
          EMPTY=$(jq 'length == 0' <<< '${{ steps.filter.outputs.changes }}')
          echo "joined-filters=$JOINED_FILTERS" >> "$GITHUB_OUTPUT"
          echo "empty=$EMPTY" >> "$GITHUB_OUTPUT"

  release:
    needs: changes
    if: github.repository == 'ryanTheLion200/react-highlight-shiki'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Packages
        if: needs.changes.outputs.empty == 'false'
        run: pnpm ${{ needs.changes.outputs.joined-filters }} build
      - name: Create Release PR or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm exec changeset publish
